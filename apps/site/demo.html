<html lang="fr">
<head>

  <title>Hexa CRM · Démo</title>
  <style>
    :root { --bg:#05040a; --fg:#eeedf8; --muted:#a09db8; --line:rgb(255 255 255/.12); --p1:#7c3aed; --p2:#a78bfa; --b1:#2563eb; --b2:#38bdf8; --ok:#34d399; --warn:#fbbf24; --bad:#f87171;

    .glass { background:linear-gradient(135deg,rgb(255 255 255/.08),rgb(255 255 255/.025)); backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%); border:1px solid var(--line); border-radius:18px; }
    .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:11px; border:1px solid var(--line); background:rgb(255 255 255/.07); cursor:pointer; font-weight:600; font-size:13px; text-decoration:none; }

    .brand { display:flex; align-items:center; gap:9px; font-size:20px; margin:2px 4px 12px; }

    main { min-width:0; padding:18px; }
    h1 { margin:0 0 4px; font-size:22px; letter-spacing:-.02em; } .sub { color:var(--muted); margin:0 0 16px; }
    .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
    .kpi { padding:14px; } .kpi b { display:block; font-size:24px; letter-spacing:-.02em; } .kpi span { color:var(--muted); font-size:12px; }
    .bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center; } .bar .grow { flex:1; }
    table { width:100%; border-collapse:collapse; } th { text-align:left; color:var(--muted); font-size:12px; font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line); } td { padding:9px 10px; border-bottom:1px solid rgb(255 255 255/.06); vertical-align:middle; }

    .tag.ok { color:var(--ok); border-color:rgb(52 211 153/.4); } .tag.w { color:var(--warn); border-color:rgb(251 191 36/.4); } .tag.b { color:var(--bad); border-color:rgb(248 113 113/.4); } .tag.n { color:var(--muted); }

    .row { display:flex; gap:8px; flex-wrap:wrap; } .row input { flex:1; min-width:140px; }
    .empty { color:var(--muted); padding:18px; text-align:center; }
    .x { background:none; border:0; color:var(--muted); cursor:pointer; padding:2px 6px; border-radius:6px; } .x:hover { color:var(--bad); background:rgb(255 255 255/.07); }

  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9a2ff"/><stop offset=".5" stop-color="#6d3df0"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs></svg>

  </div>
  <div class="toast" id="toast" hidden role="status"></div>

<script>

    time: [

    dash() {

        el("div", { class: "kpis" }, k(db.clients.length, t("kClients")), k(open.length, t("kTasks")), k(late.length, t("kLate")), k(money(owed), t("kOwed")), k(hrs + " h", t("kHours"))),
        el("div", { class: "card glass" }, el("h2", { text: t("upcoming") }), table([t("task"), t("client"), t("due")], next.map((x) => el("tr", {}, el("td", { text: x.title }), el("td", { text: cname(x.client) }), el("td", {}, tag(x.due < day(0) ? "b" : "n", dateFmt(x.due)))))))];

        el("div", { class: "bar" }, nm, ci, el("button", { class: "btn primary", onclick: add, text: t("addClient") }), docsButton()),
        table([t("name"), t("city"), t("contact"), t("fye"), ""], db.clients.map((c) => el("tr", {}, el("td", { text: c.name }), el("td", { text: c.city }), el("td", { text: c.contact }), el("td", { text: c.fye }),

    time() {

      const add = () => { const h = Math.min(24, Math.max(0.25, Number(hr.value) || 0)); if (!roomFor(db.time)) return; db.time.push({ id: ++uid, date: day(0), client: Number(cs.value), hours: h, note: clean(nt.value) || "—", billable: bl.checked }); show("time"); };

        table([t("date"), t("client"), t("note"), t("hours") + "*", ""], db.time.map((e) => el("tr", {}, el("td", { text: dateFmt(e.date) }), el("td", { text: cname(e.client) }), el("td", { text: e.note + (e.billable ? "" : " (—)") }), el("td", { class: "num", text: e.hours + " h" }),

    },
  };

  let current = "dash";
  const show = (id) => {
    current = id;
    const v = $("#view"); v.replaceChildren(...screens[id]());
    $("#menu").replaceChildren(...Object.keys(screens).map((k) => el("button", { class: "nav", "aria-current": k === id ? "page" : null, onclick: () => show(k), text: t(k) })));
  };
  const chrome = () => {
    document.documentElement.lang = lang;
    $("#b1").textContent = t("demo") + " · " + t("fake");
    $("#b2").textContent = t("bannerNote") + " " + new Date(nextReset).toLocaleTimeString(lang === "en" ? "en-CA" : "fr-CA", { hour: "2-digit", minute: "2-digit" }) + ".";
    $("#reset").textContent = t("reset"); $("#back").textContent = t("back");
    document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    show(current);
  };

  // ---- Reset: on demand, and at the start of every hour while the page is open ----
  let nextReset = 0, timer;
  const doReset = (announce) => { db = fresh(); chrome(); if (announce) toast(t("resetDone")); };
  const schedule = () => {
    const d = new Date(); d.setMinutes(0, 0, 0); d.setHours(d.getHours() + 1); nextReset = d.getTime();
    clearTimeout(timer); timer = setTimeout(() => { doReset(true); schedule(); chrome(); }, Math.max(1000, nextReset - Date.now()));
  };

  $("#reset").addEventListener("click", () => doReset(true));
  document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => { lang = b.dataset.lang; try { localStorage.setItem("hexa.site.lang", lang); } catch {} chrome(); }));
  schedule(); chrome();
})();
</script>
</body>
</html>
