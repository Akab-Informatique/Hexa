name: release

# Tag vX.Y.Z -> build + push versioned images to GHCR -> register the release in the console.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: instance
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: APP=instance
          push: true
          tags: ghcr.io/akab-informatique/hexa-instance:${{ steps.v.outputs.version }}
      - name: console
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: APP=console
          push: true
          tags: ghcr.io/akab-informatique/hexa-console:${{ steps.v.outputs.version }}
      - name: updater
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.updater
          push: true
          tags: |
            ghcr.io/akab-informatique/hexa-updater:${{ steps.v.outputs.version }}
            ghcr.io/akab-informatique/hexa-updater:stable
      - name: register release in console
        env:
          CONSOLE_URL: ${{ secrets.CONSOLE_URL }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          curl -fsS -X POST "$CONSOLE_URL/api/releases" \
            -H "authorization: Bearer $RELEASE_TOKEN" -H "content-type: application/json" \
            -d "{\"version\":\"${{ steps.v.outputs.version }}\",\"channel\":\"stable\"}"
