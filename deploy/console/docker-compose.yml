# Your admin console AND the marketing site. Run on YOUR server, behind your Nginx (proxy to 127.0.0.1:8080, HTTPS).
#   cp .env.example .env  # fill it in
#   docker compose up -d --build        (from the repo root: -f deploy/console/docker-compose.yml)
services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: hexa_console
      POSTGRES_USER: hexa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - console_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexa -d hexa_console"]
      interval: 5s
      retries: 30

  console:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args: { APP: console }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      POSTGRES_HOST: db
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"

  # The one-page marketing site, served next to the console. Its settings (config.js) are written from .env at start.
  # In your proxy (NPM) point your public site name at 127.0.0.1:8081.
  site:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      CONSOLE_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      CONTACT_EMAIL: ${SITE_CONTACT_EMAIL:-}
    volumes:
      - ../../apps/site:/site-src:ro
    command:
      - sh
      - -c
      - |
        cp -r /site-src/. /usr/share/nginx/html/
        printf 'window.HEXA = { consoleUrl: "%s", contactEmail: "%s" };
' "$CONSOLE_URL" "$CONTACT_EMAIL" > /usr/share/nginx/html/config.js
        exec nginx -g 'daemon off;'
    ports:
      - "127.0.0.1:8081:80"

volumes:
  console_pgdata:
